<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Audios — Class Tools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh; color: #fff; padding: 20px;
  }
  h1 { text-align: center; font-size: 1.5rem; margin-bottom: 8px; }
  p.sub { text-align: center; opacity: 0.6; font-size: 0.85rem; margin-bottom: 20px; }
  .container { max-width: 500px; margin: 0 auto; }
  .phrase-row {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 14px 16px;
    margin-bottom: 10px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .phrase-text { font-size: 0.95rem; flex: 1; margin-right: 10px; }
  .status {
    font-size: 0.75rem; padding: 4px 10px; border-radius: 12px;
    background: rgba(255,255,255,0.1); min-width: 70px; text-align: center;
  }
  .status.done { background: rgba(0,210,106,0.2); color: #00d26a; }
  .status.error { background: rgba(233,69,96,0.2); color: #e94560; }
  .btn {
    width: 100%; padding: 14px; border-radius: 24px; border: none;
    background: linear-gradient(135deg, #e94560, #c73e54);
    color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    margin-top: 16px; margin-bottom: 10px;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress {
    text-align: center; font-size: 0.85rem; opacity: 0.7;
    margin-bottom: 16px;
  }
  .note {
    background: rgba(255,255,255,0.05); border-radius: 12px;
    padding: 12px; font-size: 0.8rem; opacity: 0.6; line-height: 1.5;
  }
  .note code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<h1>🎙️ Generador de Audios</h1>
<p class="sub">ElevenLabs — Class Tools Pro</p>

<div class="container">
  <div class="progress" id="progress">Listo para generar 15 audios</div>
  <button class="btn" id="startBtn" onclick="startGeneration()">▶ Empezar</button>

  <div id="list"></div>

  <div class="note">
    <b>Nota:</b> Este generador corre en tu navegador. Los audios se descargan uno por uno a la carpeta <code>audio/</code>.<br><br>
    Si alguno falla, espera unos segundos y toca "Reintentar" en esa frase.
  </div>
</div>

<script>
const API_KEY = "Tsk_94865a3355f77ccc8dab9d867f5f8b4efd442a086eafb343";
const VOICE_ID = "21m00Tcm4TlvDq8ikWAM";

const phrases = [
  "Would you please repeat that?",
  "What is the meaning of that?",
  "How do you say that in English?",
  "How do you spell that?",
  "Would you please write that down?",
  "Would you please speak slower?",
  "May I please go to the bathroom?",
  "May I please take this call?",
  "May I please step outside?",
  "What is the phonetics of that?",
  "How do you pronounce that?",
  "Can you hear me clearly?",
  "Let's get started.",
  "Does anyone have any questions?",
  "That's all for today."
];

const list = document.getElementById('list');
const progress = document.getElementById('progress');
const startBtn = document.getElementById('startBtn');

// Create rows
phrases.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'phrase-row';
  row.id = `row-${i}`;
  row.innerHTML = `
    <div class="phrase-text">${i+1}. ${p}</div>
    <div class="status" id="status-${i}">Pendiente</div>
  `;
  list.appendChild(row);
});

async function startGeneration() {
  startBtn.disabled = true;
  startBtn.textContent = '⏳ Generando...';

  for (let i = 0; i < phrases.length; i++) {
    progress.textContent = `Generando ${i+1} de ${phrases.length}...`;
    await generateOne(i);
    await sleep(500); // small delay between requests
  }

  progress.textContent = '✅ ¡Todos los audios generados!';
  startBtn.textContent = '▶ Reintentar todos';
  startBtn.disabled = false;
}

async function generateOne(index) {
  const statusEl = document.getElementById(`status-${index}`);
  statusEl.textContent = '⏳...';

  try {
    const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
      method: 'POST',
      headers: {
        'Accept': 'audio/mpeg',
        'Content-Type': 'application/json',
        'xi-api-key': API_KEY
      },
      body: JSON.stringify({
        text: phrases[index],
        model_id: 'eleven_monolingual_v1',
        voice_settings: { stability: 0.5, similarity_boost: 0.5 }
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    // Trigger download
    const a = document.createElement('a');
    a.href = url;
    a.download = `phrase_${String(index+1).padStart(2,'0')}.mp3`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    statusEl.textContent = '✅ Listo';
    statusEl.className = 'status done';
  } catch (err) {
    statusEl.textContent = '❌ Error';
    statusEl.className = 'status error';
    console.error(err);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>

</body>
</html>
